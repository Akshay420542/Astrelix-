spring.application.name=orbital-mission-planner
server.port=8080

# Database Configuration (PostgreSQL with SQLite fallback)
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:orbital_planner.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Python Scientific Engine Microservice Integration
scientific.engine.url=${PYTHON_SERVICE_URL:http://localhost:8000}
celestrak.api.url=${CELESTRAK_URL:https://celestrak.org/NORAD/elements/gp.php}
